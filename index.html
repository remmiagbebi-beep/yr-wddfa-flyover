<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Snowdon Via The Llanberis Path 3D Flyover</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet" />

<style>
#iconResetView {
  width: 40px !important;
  height: 40px !important;
}
  
html,body{
  margin:0;
  height:100%;
  background:#000;
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  overflow:hidden;
}
#map{ position:absolute; inset:0 }

.ui{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  z-index:10;
  display:flex;
  flex-direction:column;
  gap:18px;
}
.ui-right{ right:20px; }
.ui-left{ left:20px; }

.btn{
  width:50px;
  height:50px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  border:3px solid #fff;
  cursor:pointer;
  background:linear-gradient(180deg,#EC2629,#b51d20);
  box-shadow:0 3px 10px rgba(0,0,0,.35);
  transition:.15s;
}
.btn:hover{
  background:linear-gradient(180deg,#3899EC,#297fc8);
}

.btn svg{
  fill:#fff;
  width:24px;
  height:24px;
  display:none;
}
.btn svg.active{ display:block }

/* base size for speed icon */
#iconSpeed{
  width:18px;
  height:18px;
}

.speed-wrap{ position:relative; width:50px; height:50px }

.speed-panel{
  position:absolute;
  top:50%;
  right:60px;
  transform:translateY(-50%) scale(.98);
  opacity:0;
  pointer-events:none;
  width:230px;
  height:45px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 10px;
  border-radius:9999px;
  border:3px solid #fff;
  background:linear-gradient(180deg,#EC2629,#b51d20);
  transition:opacity .18s,transform .18s;
  box-shadow:0 3px 10px rgba(0,0,0,.35);
}
.speed-wrap.open .speed-panel{
  opacity:1;
  transform:translateY(-50%) scale(1);
  pointer-events:auto;
}

.speed-slider{
  flex:1;
  appearance:none;
  height:6px;
  border-radius:999px;
  background:linear-gradient(90deg,#fff,#fff8);
  outline:none;
}
.speed-slider::-webkit-slider-thumb{
  appearance:none;
  width:18px;
  height:18px;
  border-radius:50%;
  background:#fff;
  border:2px solid #EC2629;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
  cursor:pointer;
}

/* MOBILE MENU BUTTON – base style, visibility handled in JS */
.mobile-menu-btn{
  position:absolute;
  bottom:20px;
  right:20px;
  z-index:20;
  display:none;
}

/* Fake fullscreen hook (desktop / android) */
body.fake-fullscreen #map{
  position:fixed;
  inset:0;
  z-index:1;
}
body.fake-fullscreen .ui,
body.fake-fullscreen #btnMobileMenu{
  z-index:2;
}

/* MOBILE LAYOUT + 85% BUTTON SIZE, NO WHITE BORDERS, BACKWARDS L ALIGNMENT */
@media (max-width: 767px){

  :root{
    --btn-size:42px;
    --gap:8px;
    --menu-offset:20px;
  }

  /* all buttons 85% of desktop and NO border */
  .btn{
    width:var(--btn-size);
    height:var(--btn-size);
    border:none;
  }
  .btn svg{
    width:20px;
    height:20px;
  }

  /* speed icon 15% smaller on normal mobile (non fullscreen) */
  body:not(.ios-fullscreen) #iconSpeed{
    width:14px !important;
    height:14px !important;
  }

  #iconResetView{
    width:34px !important;
    height:34px !important;
  }

  .speed-wrap{
    width:var(--btn-size);
    height:var(--btn-size);
  }
  .speed-panel{
    height:36px;
    right:50px;
    width:185px;
    border:none;
    gap:9px;
    padding:0 7px;
  }
  .speed-slider::-webkit-slider-thumb{
    width:15px;
    height:15px;
  }

  /* menu absolutely in bottom right */
  .mobile-menu-btn{
    position:absolute;
    bottom:var(--menu-offset);
    right:var(--menu-offset);
    z-index:20;
  }

  #btnMobileMenu{
    width:var(--btn-size);
    height:var(--btn-size);
    border:none;
  }
  #btnMobileMenu svg{
    width:20px;
    height:20px;
  }

  /* backwards L: all gaps = var(--gap), edges aligned to menu */
  .ui-left,
  .ui-right{
    top:auto;
    transform:none;
    gap:var(--gap);
  }

  /* bottom row to the left of menu */
  .ui-right{
    bottom:var(--menu-offset);
    right:calc(var(--menu-offset) + var(--btn-size) + var(--gap));
    left:auto;
    flex-direction:row-reverse;
    align-items:flex-end;
  }

  /* vertical stack above menu */
  .ui-left{
    bottom:calc(var(--menu-offset) + var(--btn-size) + var(--gap));
    right:var(--menu-offset);
    left:auto;
    flex-direction:column;
    align-items:flex-end;
  }

  /* iOS FULLSCREEN TAB */
  body.ios-fullscreen{
    --btn-size:57px;
  }

  body.ios-fullscreen .btn svg{
    width:27px;
    height:27px;
  }

  body.ios-fullscreen #iconSpeed{
    width:17px !important;
    height:17px !important;
  }

  body.ios-fullscreen #iconResetView{
    width:45px !important;
    height:45px !important;
  }
  body.ios-fullscreen .speed-panel{
    height:50px;
    right:60px;
    width:255px;
    gap:14px;
    padding:0 12px;
  }
  body.ios-fullscreen .speed-slider::-webkit-slider-thumb{
    width:20px;
    height:20px;
  }

  body.ios-fullscreen #btnFull{
    display:none !important;
  }
}
</style>
</head>

<body>
<div id="map"></div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
<script src="https://unpkg.com/@tmcw/togeojson@5.8.0/dist/togeojson.umd.js"></script>

<script>
mapboxgl.accessToken="pk.eyJ1IjoicmVtbWlhZ2JlYmkiLCJhIjoiY21odHRrYTQzMTk0bjJqcjE1b2xhZ2FraSJ9.nTCz33gX0gQt3T4A6VD0oQ";

const GPX_URL="https://raw.githubusercontent.com/remmiagbebi-beep/yr-wddfa-flyover/main/Snowdon%20Via%20The%20Llanberis%20Path.gpx";

let map=null;

(async()=>{

  map=new mapboxgl.Map({
    container:"map",
    style:"mapbox://styles/mapbox/satellite-streets-v12",
    center:[-4.128,53.118],
    zoom:13.5,
    pitch:75,
    bearing:-20,
    antialias:true,
    attributionControl:true
  });

  map.addControl(
    new mapboxgl.AttributionControl({
      compact:true,
      customAttribution:"© Maxar"
    }),
    "bottom-right"
  );

})();
</script>

</body>
</html>
